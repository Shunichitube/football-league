<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>選手モーション確認</title>
<style>body{margin:32px;background:#12202d;color:#e9f4f4;font:16px sans-serif}h1{font-size:24px}main{display:flex;gap:20px;flex-wrap:wrap}figure{margin:0;padding:16px;border:1px solid #4f807a;border-radius:12px;background:#203442;text-align:center}canvas{width:240px;height:240px;image-rendering:pixelated}button{padding:10px 18px;margin:0 8px 18px 0;color:#e9f4f4;background:#204b49;border:1px solid #6cc5b1;border-radius:6px;cursor:pointer}figcaption{margin:8px}p{color:#b9d3d1}figure button{font-size:13px;margin:8px 0 0}small{display:block;color:#b9d3d1}.appearance-controls{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin:18px 0 24px}label{display:flex;gap:8px;align-items:center}select{background:#203442;color:#e9f4f4;padding:8px;border:1px solid #638980;border-radius:5px}</style>
<h1>選手・キーパーモーション</h1><nav aria-label="アバター確認画面" style="display:flex;gap:10px;flex-wrap:wrap;padding:12px;margin:12px 0;background:#203442;border:1px solid #638980;border-radius:8px"><a style="color:#9ae4ca" href="motion-preview.html?v=motion-ui-v14">モーション確認</a><a style="color:#9ae4ca" href="hair-adjust.html?motion=idle&v=motion-ui-v14">待機の髪を調整</a><a style="color:#9ae4ca" href="hair-adjust.html?motion=run&v=motion-ui-v14">走りの髪を調整</a><a style="color:#9ae4ca" href="preview.html?v=motion-ui-v14">立ち絵の髪型一覧</a><a style="color:#9ae4ca" href="hair-adjust.html?motion=shoot&v=motion-ui-v14">シュートの髪を調整</a><a style="color:#9ae4ca" href="hair-adjust.html?motion=celebrate&v=motion-ui-v14">喜ぶ髪を調整</a><a style="color:#9ae4ca" href="hair-adjust.html?motion=catch&v=motion-ui-v14">キャッチの髪を調整</a><a style="color:#9ae4ca" href="hair-adjust.html?motion=dive&v=motion-ui-v14">飛び込みの髪を調整</a></nav><p>統一プレビュー v14：待機2コマ・走り4コマ・新しいシュート4コマ。髪はモーション別に調整できます。</p><p>待機・走り・ドリブル・右足シュート・キャッチ・飛び込み・喜ぶ差分を表示。各カードで1コマずつ確認できます。シュートは右足を保つため右向きで表示します。</p>
<button id="pause">一時停止</button><button id="reset">最初から再生</button><button id="speed">半分の速さ</button><button id="direction">左向きに切り替え</button><a style="color:#8de8c2" href="preview.html?v=motion-ui-v14">髪型20種の一覧</a>　<a style="color:#8de8c2" href="rare-preview.html">レアキャラ一覧・喜び差分</a>　<a style="color:#8de8c2" href="hair-adjust.html?motion=idle&v=motion-ui-v14">待機の髪を調整</a>　<a style="color:#8de8c2" href="hair-adjust.html?motion=run&v=motion-ui-v14">走りの髪を調整</a>　<a style="color:#8de8c2" href="player-idle-redrawn-v1.png?v=idle-approved-v5">新しい待機ベースを見る</a><section class="appearance-controls"><label>キャラクター<select id="character"><option value="">通常選手</option></select></label><label>髪型<select id="hair"></select></label><label>顔<select id="face"></select></label><label>肌色<select id="skin"></select></label><label><input id="glasses" type="checkbox">眼鏡</label><label>クラブカラー<input id="kit" type="color" value="#2065db"></label><label><input id="base-only" type="checkbox">ベース素材だけ表示</label><span>GKはグレー固定</span></section><main></main>
<script>
// Back/forward navigation must not restore a stale idle preview.
addEventListener('pageshow',event=>{if(event.persisted)location.reload();});
addEventListener('pagehide',()=>{document.querySelectorAll('main canvas').forEach(canvas=>canvas.getContext('2d').clearRect(0,0,canvas.width,canvas.height));});
</script>
<script type="module">
import {MOTIONS,motionFrame,loadMotionAtlas,drawMotion} from '../../js/player-motion.js?v=motion-ui-v14';
import {celebrationTexture,drawCelebration} from '../../js/avatar-celebration.js?v=motion-ui-v14';
import {HAIR_STYLES,FACE_STYLES,SKIN_TONES} from '../../js/avatar-profile.js?v=rare-motion-preview-v1';
import {RARE_CHARACTERS} from '../../js/rare-characters.js';
const character=document.querySelector('#character');
Object.entries(RARE_CHARACTERS).forEach(([kind,entry])=>character.add(new Option(entry.name,kind)));
const hair=document.querySelector('#hair'),face=document.querySelector('#face'),skin=document.querySelector('#skin'),glasses=document.querySelector('#glasses'),kit=document.querySelector('#kit');
HAIR_STYLES.forEach((name,i)=>hair.add(new Option(name,i)));FACE_STYLES.forEach((name,i)=>face.add(new Option(name,i)));SKIN_TONES.forEach((tone,i)=>skin.add(new Option(tone.label,i)));hair.value='2';
character.onchange=()=>{const rare=Boolean(character.value);[hair,face,skin,glasses,kit,document.querySelector('#base-only')].forEach(control=>control.disabled=rare);if(rare){glasses.checked=false;document.querySelector('#base-only').checked=false;}};
const atlas=await loadMotionAtlas();
const previewMotions={...MOTIONS,celebrate:{label:'喜ぶ',frames:[0,1,2,3],fps:3}};
const previewFrame=(key,seconds)=>key==='celebrate'?Math.floor(Math.max(0,seconds)*previewMotions.celebrate.fps)%4:motionFrame(key,seconds);
let paused=false,previous=null,direction='right',speed=1;
const views=Object.entries(previewMotions).map(([key,motion])=>{
 const figure=document.createElement('figure'),canvas=document.createElement('canvas'),caption=document.createElement('figcaption'),step=document.createElement('button');
 canvas.width=480;canvas.height=480;step.textContent='1コマ進める';
 const view={key,caption,ctx:canvas.getContext('2d'),seconds:0};
 step.onclick=()=>{paused=true;document.querySelector('#pause').textContent='再生';view.seconds=(previewFrame(key,view.seconds)+1)%motion.frames.length/motion.fps;};
 figure.append(canvas,caption,step);if(key==='shoot'){const note=document.createElement('small');note.textContent='右足・右向き';figure.append(note);}
 document.querySelector('main').append(figure);return view;
});
document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'再生':'一時停止';};
document.querySelector('#reset').onclick=()=>{views.forEach(v=>v.seconds=0);paused=false;document.querySelector('#pause').textContent='一時停止';};
document.querySelector('#speed').onclick=e=>{speed=speed===1?.5:1;e.target.textContent=speed===1?'半分の速さ':'通常の速さ';};
document.querySelector('#direction').onclick=e=>{direction=direction==='right'?'left':'right';e.target.textContent=direction==='right'?'左向きに切り替え':'右向きに切り替え';};
function tick(now){const dt=previous!==null&&!paused&&!document.hidden?Math.min((now-previous)/1000,.1)*speed:0;previous=now;for(const view of views){const {key,ctx,caption}=view,motion=previewMotions[key];view.seconds+=dt;const cycle=motion.frames.length/motion.fps+(motion.loop===false?.7:0);if(!paused)view.seconds%=cycle;const rare=character.value,action=rare&&['catch','dive'].includes(key)?'idle':key;const appearance=rare?{rareCharacter:rare,glasses:false}:{hairStyle:Number(hair.value),face:Number(face.value),skinTone:Number(skin.value),glasses:glasses.checked};
if(key==='celebrate'){
 ctx.clearRect(0,0,ctx.canvas.width,ctx.canvas.height);ctx.save();
 if(direction==='left'){ctx.translate(ctx.canvas.width,0);ctx.scale(-1,1);}
 const texture=celebrationTexture(atlas,appearance,{kit:kit.value,pose:previewFrame(key,view.seconds),baseOnly:document.querySelector('#base-only').checked});
 drawCelebration(ctx,texture,ctx.canvas.width/2,ctx.canvas.height*.875,ctx.canvas.height*.75);ctx.restore();
}else drawMotion(ctx,atlas,action,view.seconds,{direction,ball:true,appearance,kit:kit.value,baseOnly:document.querySelector('#base-only').checked});caption.textContent=rare?`${RARE_CHARACTERS[rare].name} · ${motion.label}${action!==key?'（専用差分なし・待機表示）':''}`:`${motion.label} · ${previewFrame(key,view.seconds)+1} / ${motion.frames.length}コマ`;}requestAnimationFrame(tick);}requestAnimationFrame(tick);
</script></html>

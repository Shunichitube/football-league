<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>髪型20種・選手アバター</title>
<style>body{background:#12202d;color:#e9f4f4;font:16px sans-serif;margin:24px}h1{font-size:24px}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;max-width:1200px}figure{margin:0;background:#203442;border:1px solid #43605a;border-radius:12px;text-align:center;padding:10px}canvas{width:150px;height:235px;image-rendering:pixelated}figcaption{padding:8px}section{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin:24px 0}label{display:flex;gap:8px;align-items:center}select{background:#203442;color:#e9f4f4;padding:8px;border:1px solid #638980;border-radius:5px}a{color:#8de8c2}p{line-height:1.6}</style>
<h1>髪型20種 × 髪色10色 × 肌色3色 × 眼鏡</h1><p>顔3種類も組み合わせられます。クラブカラーでユニフォームを変更できます。キーパーはグレー固定です。</p><p><a href="motion-preview.html">同じ見た目で動作を確認する</a></p>
<section><label>髪色<select id="hairColor"></select></label><label>肌色<select id="skin"></select></label><label>顔<select id="face"></select></label><label><input id="glasses" type="checkbox">眼鏡</label><label>クラブカラー<input id="kit" type="color" value="#2065db"></label><label><input id="keeper" type="checkbox">キーパー</label></section><main></main>
<script type="module">
import {playerAvatarTexture,HAIR_STYLES,FACE_STYLES,SKIN_TONES,HAIR_COLORS} from '../../js/player-avatar.js?v=appearance-v15';
const hairColor=document.querySelector('#hairColor');HAIR_COLORS.forEach((tone,i)=>hairColor.add(new Option(tone.label,i)));
const skin=document.querySelector('#skin'),face=document.querySelector('#face'),glasses=document.querySelector('#glasses'),kit=document.querySelector('#kit'),keeper=document.querySelector('#keeper');
SKIN_TONES.forEach((tone,i)=>skin.add(new Option(tone.label,i)));FACE_STYLES.forEach((name,i)=>face.add(new Option(name,i)));
function render(){const main=document.querySelector('main');main.replaceChildren();HAIR_STYLES.forEach((name,hairStyle)=>{const figure=document.createElement('figure'),caption=document.createElement('figcaption');figure.append(playerAvatarTexture({hairStyle,hairColor:Number(hairColor.value),face:Number(face.value),skinTone:Number(skin.value),glasses:glasses.checked},{kit:kit.value,goalkeeper:keeper.checked}));caption.textContent=`${hairStyle+1}. ${name}`;figure.append(caption);main.append(figure);});}
for(const control of [hairColor,skin,face,glasses,kit,keeper])control.addEventListener('input',render);render();
</script></html>
